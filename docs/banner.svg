    <text x="640" y="246" text-anchor="middle" font-family="Manrope, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="3" fill="#f7f9fc">ALTRONIX <tspan font-weight="500" font-size="30" letter-spacing="9" fill="#bcd2f7">SOFTWARE</tspan></text>

    <rect x="480" y="262" width="320" height="2" fill="url(#rule)"/>

    <text x="640" y="316" text-anchor="middle" font-family="Manrope, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-.6" fill="url(#tag)">Practical AI. Serious engineering.</text>

    <text x="640" y="372" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="3.6" fill="#8fdde8">SOFTWARE ENGINEERING &amp; APPLIED AI</text>
