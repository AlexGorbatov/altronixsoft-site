<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Altronix Software — Practical AI. Serious engineering.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset=".55" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#241a44"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8f5dd3" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8f5dd3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1a7cfb" stop-opacity=".30"/>
      <stop offset="1" stop-color="#1a7cfb" stop-opacity="0"/>
